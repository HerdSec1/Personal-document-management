<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>PerDocMan - Search</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">Search Documents</h1>
                <p class="text-muted mb-0">Query indexed PDFs</p>
            </div>

            <a href="/" class="btn btn-outline-secondary">
                Back to Dashboard
            </a>
        </div>

        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body">

                <form method="GET" action="/search" class="row g-3">

                    <div class="col-md-6">
                        <input type="text" name="q" value="{{query}}" class="form-control"
                            placeholder="Search documents">
                    </div>

                    <div class="col-md-4">
                        <select name="sensitivity" class="form-select">

                            <option value="">Any sensitivity</option>

                            <option value="low" {{low_selected}}>
                                Low
                            </option>

                            <option value="moderate" {{moderate_selected}}>
                                Moderate
                            </option>

                            <option value="high" {{high_selected}}>
                                High
                            </option>

                            <option value="critical" {{critical_selected}}>
                                Critical
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2 d-grid">
                        <button class="btn btn-primary" type="submit">
                            Search
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">

                <h5 class="card-title mb-3">
                    Results
                </h5>

                <div class="table-responsive">

                    {{results_table}}

                </div>

            </div>
        </div>

    </div>

</body>

</html>
