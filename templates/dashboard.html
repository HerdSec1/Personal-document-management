<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PerDocMan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">

            <div>
                <h1 class="mb-1">PerDocMan</h1>
                <p class="text-muted mb-0">Local-first personal document manager</p>
            </div>

            <div>
                <a href="/documents" class="btn btn-outline-secondary">
                    View Documents
                </a>
            </div>

        </div>

        {{banner}}

        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body">
                        <div class="text-muted small mb-2">Documents Indexed</div>
                        <div class="display-6 fw-semibold">{{count}}</div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Search</h5>

                        <form method="GET" action="/search" class="row g-2">

                            <div class="col-md-6">
                                <input class="form-control" type="text" name="q" placeholder="Search documents" />
                            </div>

                            <div class="col-md-4">
                                <select class="form-select" name="sensitivity">

                                    <option value="">Any sensitivity</option>
                                    <option value="low">Low</option>
                                    <option value="moderate">Moderate</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>

                                </select>
                            </div>

                            <div class="col-md-2 d-grid">
                                <button class="btn btn-primary" type="submit">
                                    Search
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>


        <div class="row g-4">

            <!-- LEFT COLUMN -->

            <div class="col-lg-5">

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Upload PDF</h5>

                        <form method="POST" action="/ingest" enctype="multipart/form-data">

                            <div class="mb-3">
                                <label class="form-label">PDF File</label>
                                <input class="form-control" type="file" name="file" accept=".pdf" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Sensitivity</label>

                                <select class="form-select" name="sensitivity">

                                    <option value="low">Low</option>
                                    <option value="moderate" selected>Moderate</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>

                                </select>

                            </div>

                            <div class="mb-3">
                                <label class="form-label">Expires At (YYYY-MM-DD)</label>

                                <input class="form-control" type="text" name="expires_at" placeholder="2026-12-31" />

                            </div>

                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit">
                                    Upload Document
                                </button>
                            </div>

                        </form>

                    </div>
                </div>


                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Document Statistics</h5>

                        {{stats_html}}

                    </div>
                </div>

            </div>


            <!-- RIGHT COLUMN -->

            <div class="col-lg-7">

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Sensitivity Summary</h5>

                        {{sens_html}}

                    </div>
                </div>


                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Expiring Soon</h5>

                        <div class="table-responsive">

                            {{exp_table}}

                        </div>

                    </div>
                </div>


                <div class="card shadow-sm border-danger">
                    <div class="card-body">

                        <h5 class="card-title text-danger mb-3">
                            Admin
                        </h5>

                        <form method="POST" action="/reset"
                            onsubmit="return confirm('Are you sure? This will wipe the database and cannot be undone.');">

                            <div class="d-grid">

                                <button class="btn btn-outline-danger" type="submit">
                                    Wipe Database
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
